name: Task 5 Pipeline (Multi-Branch)

on:
  push:
    branches:
      - develop
      - test
      - production
    paths:
      - 'task_5/**'

env:
  ACR_LOGIN_SERVER: 'itransitionintrenshiptaskscontainerregistry.azurecr.io'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        
      - name: Build and Push Docker Image
        run: |
          docker build --no-cache -t ${{ env.ACR_LOGIN_SERVER }}/task5:${{ github.ref_name }} ./task_5
          docker push ${{ env.ACR_LOGIN_SERVER }}/task5:${{ github.ref_name }}

      - name: Deploy to Azure Web App (Development)
        if: github.ref_name == 'develop'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'task5-dev-webapp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TASK5_DEV }}
          images: '${{ env.ACR_LOGIN_SERVER }}/task5:develop'

      - name: Deploy to Azure Web App (Testing)
        if: github.ref_name == 'test'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'task5-test-webapp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TASK5_TEST }}
          images: '${{ env.ACR_LOGIN_SERVER }}/task5:test'

      - name: Deploy to Azure Web App (Production)
        if: github.ref_name == 'production'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'task5-prod-webapp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TASK5_PROD }}
          images: '${{ env.ACR_LOGIN_SERVER }}/task5:production'
