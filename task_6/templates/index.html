<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Faker Data Generator</title>
    <!-- Tailwind CSS for modern, utility-first styling -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- Top Navigation Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-teal-400 tracking-wide">
                ⚙️ SQL-Faker Engine
            </h1>
            <div class="text-sm text-gray-400">
                Data Layer Architecture: <span class="text-gray-200 font-mono">PL/pgSQL Procedural Stack</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Controls Console Panel -->
        <section class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg">
            <form id="generatorForm" class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-4 items-end">
                
                <!-- Locale Selection Input -->
                <div class="space-y-2">
                    <label for="locale" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Target Locale</label>
                    <select id="locale" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-teal-500 transition">
                        <option value="ENG">English (USA)</option>
                        <option value="DEU">German (Germany)</option>
                    </select>
                </div>

                <!-- Seed Entry Input -->
                <div class="space-y-2">
                    <label for="seed" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Base Seed Value</label>
                    <div class="flex gap-2">
                        <input type="number" id="seed" value="42" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-teal-500 transition font-mono" required>
                        <button type="button" id="randomizeSeedBtn" class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-2 rounded-lg transition" title="Generate Random Seed">
                            🎲
                        </button>
                    </div>
                </div>

                <!-- Run / Reset Generation Button -->
                <div>
                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-semibold px-4 py-2 rounded-lg shadow transition duration-200">
                        Generate Fresh Batch
                    </button>
                </div>

                <!-- Batch Context Metric Tracker -->
                <div class="text-sm text-gray-400 sm:col-span-3 lg:col-span-1 flex items-center justify-start lg:justify-end h-10">
                    Active Batch Index: <span id="batchIndicator" class="ml-2 font-mono font-bold text-teal-400 bg-gray-900 px-3 py-1 rounded border border-gray-700">0</span>
                </div>
            </form>
        </section>

        <!-- Status / Notification Dynamic Boxes -->
        <div id="loadingIndicator" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-t-teal-500 border-gray-700"></div>
            <p class="text-sm text-gray-400 mt-2">Invoking procedural transaction matrix...</p>
        </div>

        <div id="errorAlert" class="hidden bg-red-900/50 border border-red-700 text-red-200 px-4 py-3 rounded-lg text-sm"></div>

        <!-- Data Grid Output Grid Card View -->
        <section id="resultsContainer" class="hidden bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-gray-750 border-b border-gray-700 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                            <th class="px-6 py-4">Full Name</th>
                            <th class="px-6 py-4">Address</th>
                            <th class="px-6 py-4">Phone Number</th>
                            <th class="px-6 py-4">Email Address</th>
                            <th class="px-6 py-4">Coordinates (Lat, Lon)</th>
                            <th class="px-6 py-4 text-center">Physical Attributes</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="divide-y divide-gray-700/50 text-sm text-gray-300">
                        <!-- Dynamic generated rows injected via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Table Footer Action Routing -->
            <div class="bg-gray-750 p-4 border-t border-gray-700 flex justify-end">
                <button id="nextBatchBtn" class="bg-gray-700 hover:bg-gray-600 text-teal-400 border border-teal-500/30 px-5 py-2 rounded-lg font-medium shadow-sm transition">
                    Advance to Next Batch &rarr;
                </button>
            </div>
        </section>

    </main>

        <!-- Frontend Core Application Controller Logic -->
    <script>
        let currentBatchIndex = 0;

        document.getElementById('randomizeSeedBtn').addEventListener('click', () => {
            document.getElementById('seed').value = Math.floor(Math.random() * 999999) + 1;
        });

        // Trigger action mapping loop for clean generation
        document.getElementById('generatorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            currentBatchIndex = 0; // Reset pagination tracking on explicit configuration change
            fetchFakerBatch();
        });

        document.getElementById('nextBatchBtn').addEventListener('click', () => {
            currentBatchIndex++;
            fetchFakerBatch();
        });

        // Async API Client Execution Pipeline Engine
        async function fetchFakerBatch() {
            const locale = document.getElementById('locale').value;
            const seed = document.getElementById('seed').value;
            
            const loading = document.getElementById('loadingIndicator');
            const errorAlert = document.getElementById('errorAlert');
            const resultsContainer = document.getElementById('resultsContainer');
            const tableBody = document.getElementById('usersTableBody');
            const batchIndicator = document.getElementById('batchIndicator');

            // Set layout elements visibility states
            loading.classList.remove('hidden');
            errorAlert.classList.add('hidden');
            batchIndicator.textContent = currentBatchIndex;

            try {
                const response = await fetch(`/api/users?locale=${locale}&seed=${seed}&batch_index=${currentBatchIndex}`);
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Backend failed executing target database batch script loop.');
                }

                const users = await response.json();
                
                // Flush existing rows prior to rendering new payload
                tableBody.innerHTML = '';

                if (users.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500 italic">No user definitions records found. Check lookup configurations dataset.</td></tr>`;
                } else {
                    users.forEach(user => {
                        const row = document.createElement('tr');
                        row.className = "hover:bg-gray-750 transition-colors duration-150";
                        row.innerHTML = `
                            <td class="px-6 py-4 font-semibold text-white">${escapeHtml(user.full_name)}</td>
                            <td class="px-6 py-4 text-gray-400 max-w-xs truncate" title="${escapeHtml(user.street_address)}">${escapeHtml(user.street_address)}</td>
                            <td class="px-6 py-4 font-mono text-gray-300">${escapeHtml(user.phone_number)}</td>
                            <td class="px-6 py-4 text-teal-400 font-mono">${escapeHtml(user.email_address)}</td>
                            <td class="px-6 py-4 font-mono text-xs text-gray-400">
                                <span class="text-gray-300">${user.latitude.toFixed(6)}</span>, 
                                <span class="text-gray-300">${user.longitude.toFixed(6)}</span>
                            </td>
                            <td class="px-6 py-4 text-center text-xs">
                                <span class="inline-block bg-gray-900 border border-gray-700 px-2 py-1 rounded text-gray-300 mr-1" title="Height">🏃 ${user.height_cm} cm</span>
                                <span class="inline-block bg-gray-900 border border-gray-700 px-2 py-1 rounded text-gray-300 mr-1" title="Weight">⚖️ ${user.weight_kg} kg</span>
                                <span class="inline-block bg-gray-900 border border-gray-700 px-2 py-1 rounded text-gray-300" title="Eye Color">👁️ ${escapeHtml(user.eye_color)}</span>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                }
                
                resultsContainer.classList.remove('hidden');
            } catch (err) {
                errorAlert.textContent = err.message;
                errorAlert.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Sanitization utility targeting script injection mitigation bounds
        value = "escapeHtml"
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
